; DBD profile, read by Core (Misc/ModkitCore.cpp) before any plugin loads. Arrays are repeated plain keys (no +).
; Cipher step vocabulary: Aes | Xor:TocHeader:<offset>:<len> (IoStore only, before Aes) | Xor:FooterCustom (pak only).
; Format: docs/container-cipher.md and docs/profile-format.md of the workspace.
[Profile]
Id=dbd
Description=Dead by Daylight 10.2.2 (UE 5.7)
RequiresHookApi=1

[Containers]
ProbeFile=global.utoc
ProbeFile=pakchunk0-Windows.utoc
PaksSubdir=
PaksSubdir=Paks
PaksSubdir=Content/Paks
PaksSubdir=DeadByDaylight/Content/Paks
GlobalToc=global.utoc
LookLooseFirst=true
ImplyUsePaks=true
IoStoreDirectoryIndex=Xor:TocHeader:104:36;Aes
PakIndex=Aes;Xor:FooterCustom
PakFooterVariant=Guid16;Encrypted1;Magic4;Version4;IndexOffset8;IndexSize8;IndexHash20;Custom28;U32;CompressionNames5x32

[ShaderLibrary]
Name=DeadByDaylight
SkipCookedGlobalShaderCache=true

[ShaderLayout]
AliasUniformBuffers=true
TolerateMismatch=FMaterialShaderMapContent
TolerateMismatch=FMeshMaterialShaderMap
TolerateMismatch=FGlobalShaderMapContent
TolerateMismatch=FShaderMapContent

[ContentMounts]
PluginScanRoot=../../../DeadByDaylight/Plugins

[AssetRegistry]
UsePremade=true
PakPath=../../../DeadByDaylight/AssetRegistry.bin

[AssetEditors]
GenericEditorClass=/Script/Niagara.NiagaraSystem
GenericEditorClass=/Script/Niagara.NiagaraEmitter
GenericEditorClass=/Script/DataflowEngine.Dataflow
