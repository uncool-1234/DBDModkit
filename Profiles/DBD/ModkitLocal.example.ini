; Copy into the project root as ModkitLocal.ini and edit. Machine specific: this file is the ONLY place with absolute paths.
; Never put a key VALUE here, only the path of the key file.
[Local]
; directory with engine.ini (read by the engine) and profile.json (read by Suzie); i.e. <Suzie plugin>/Profiles/DBD
Profile=<absolute path of Suzie/Profiles/DBD>
GameRoot=<install root of the game, the profile lists the Paks sub directories>
KeyFile=<absolute path of the AES key file>
; optional
EngineDir=<engine root, used by the sweep harness (otherwise the path in the .uproject EngineAssociation)>
Jmap=<jmap of the game, baker input>
Usmap=<usmap of the game>
UsmapTsv=<usmap schema dump for Suzie.VerifyNativeTypes (default: data/cache/game_schemas.tsv of the profile)>
